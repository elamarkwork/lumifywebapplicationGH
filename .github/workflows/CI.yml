name: BuildAndPublish

on:
  workflow_dispatch

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore DDLSWebApp.csproj
    - name: Build
      run: dotnet build DDLSWebApp.csproj --no-restore
    - name: publish
      run: dotnet publish DDLSWebApp.csproj -c Release -o publish
    - name: Creating artifact directories
      run: |
         mkdir buildartifacts
    - name: Archive Application
      run: |
        zip -qq -r buildartifacts/Application.zip publish
    - name: Upload Application to Build Artifact
      continue-on-error: false
      uses: actions/upload-artifact@v4
      with:
        name: appzip
        path: buildartifacts/Application.zip
        
  TestDownload:
    needs: build
    runs-on: ubuntu-latest

    steps:

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      continue-on-error: false
      with:
        name: appzip
